<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marg — Your CAT Mentor</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0D0D;
    --surface: #161616;
    --surface2: #1E1E1E;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --gold-dim: rgba(201,168,76,0.12);
    --gold-dim2: rgba(201,168,76,0.06);
    --text: #F0EDE6;
    --text-muted: #888880;
    --text-dim: #555550;
    --green: #4CAF7D;
    --green-dim: rgba(76,175,125,0.1);
    --red: #E05C5C;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  #header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    flex-shrink: 0;
  }

  #logo {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #C9A84C, #8B6914);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 600;
    color: #0D0D0D;
    flex-shrink: 0;
  }

  #header-info { flex: 1; }
  #header-info h1 {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--gold-light);
    letter-spacing: 0.02em;
  }
  #header-info p {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  #status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
    margin-right: 5px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  #profile-badge {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    cursor: pointer;
    transition: border-color 0.2s;
    display: none;
  }
  #profile-badge:hover { border-color: var(--gold); color: var(--gold); }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .msg-wrap { display: flex; gap: 10px; align-items: flex-end; max-width: 82%; }
  .msg-wrap.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-wrap.marg { align-self: flex-start; }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #C9A84C, #8B6914);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 11px; font-weight: 600;
    color: #0D0D0D;
    flex-shrink: 0;
  }

  .bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.65;
    max-width: 100%;
  }

  .msg-wrap.marg .bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg-wrap.user .bubble {
    background: var(--gold-dim);
    border: 1px solid rgba(201,168,76,0.2);
    border-bottom-right-radius: 4px;
    color: var(--text);
  }

  /* Onboarding cards */
  .onboard-card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 4px;
  }

  .onboard-card p {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .options-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .opt-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 7px 14px;
    border: 1px solid var(--border2);
    border-radius: 20px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
  }
  .opt-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: var(--gold-dim2);
  }
  .opt-btn.selected {
    border-color: var(--gold);
    background: var(--gold-dim);
    color: var(--gold-light);
  }

  /* Profile summary card */
  .profile-card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-left: 3px solid var(--gold);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-top: 4px;
    font-size: 13px;
  }

  .profile-card .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--gold);
    margin-bottom: 6px;
  }

  .profile-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .profile-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .profile-item span:first-child {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .profile-item span:last-child {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }

  /* Typing indicator */
  .typing-bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-bottom-left-radius: 4px;
    padding: 13px 16px;
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .typing-bubble span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.3s infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.36s; }

  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); background: var(--text-dim); }
    30% { transform: translateY(-5px); background: var(--gold); }
  }

  /* Input area */
  #input-area {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  #input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #user-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 22px;
    padding: 10px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    resize: none;
    outline: none;
    max-height: 120px;
    overflow-y: auto;
    transition: border-color 0.2s;
    line-height: 1.5;
  }
  #user-input:focus { border-color: rgba(201,168,76,0.4); }
  #user-input::placeholder { color: var(--text-dim); }

  #send-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #C9A84C, #8B6914);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s, transform 0.15s;
  }
  #send-btn:hover { opacity: 0.85; transform: scale(1.05); }
  #send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  #send-btn svg { width: 16px; height: 16px; fill: #0D0D0D; }

  #hint {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 8px;
  }

  /* Section divider in chat */
  .section-label {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 0;
    position: relative;
  }
  .section-label::before, .section-label::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 30%;
    height: 1px;
    background: var(--border);
  }
  .section-label::before { left: 0; }
  .section-label::after { right: 0; }

  /* Highlight in bubble */
  .highlight { color: var(--gold-light); font-weight: 500; }
  .muted { color: var(--text-muted); }

  /* Suggestion chips after AI response */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 5px 11px;
    border: 1px solid var(--border2);
    border-radius: 14px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.18s;
  }
  .chip:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-dim2); }

  /* Fade in animation */
  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<div id="header">
  <div id="logo">M</div>
  <div id="header-info">
    <h1>Marg</h1>
    <p><span id="status-dot"></span>Your personal CAT mentor</p>
  </div>
  <div id="profile-badge" onclick="showProfile()">My profile ↓</div>
</div>

<div id="messages"></div>

<div id="input-area">
  <div id="input-row">
    <textarea id="user-input" rows="1" placeholder="Ask Marg anything about CAT..." disabled></textarea>
    <button id="send-btn" onclick="sendMessage()" disabled aria-label="Send">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
  <div id="hint">Press Enter to send · Shift+Enter for new line</div>
</div>

<script>
const SYSTEM_PROMPT = `You are Marg, a warm and deeply knowledgeable CAT exam mentor built specifically for Indian students. Your name means "path" in Hindi — you are literally their path to success.

PERSONALITY:
- You speak like a brilliant senior who cracked CAT and genuinely wants to help juniors
- Warm, real, never preachy or robotic
- You understand Indian student reality: pressure from parents, financial constraints, coaching vs self-study dilemma, juggling college and prep simultaneously, the shame of failing CAT, the confusion of "where do I even start"
- Occasionally use natural Hindi phrases like "bilkul", "dekho", "suno", "yaar", "seedha baat" — but sparingly and only when it feels natural
- Never generic. Every response is tailored to the student's specific profile you've built

STUDENT PROFILE (you will receive this as context):
You have already collected: attempt number, months until exam, weakest section, daily study hours, current situation (working/college/dropper). USE THIS PROFILE IN EVERY RESPONSE. Never give advice that ignores their constraints.

DIFFERENTIATION FROM GENERIC CHATBOTS:
1. You reference their specific profile in responses — "Given that you only have 3 months and VARC is your weak spot..."
2. You ask smart follow-up questions mid-conversation when you need more context before advising
3. You understand Indian CAT coaching ecosystem: TIME, IMS, CL, Unacademy, PW, self-study routes
4. You know Indian college priorities: IIM A/B/C vs new IIMs vs XLRI vs MDI vs FMS — and guide accordingly
5. You understand the emotional weight — failed attempts, parental pressure, peer comparison
6. You give specific weekly/monthly plans, not vague advice
7. When someone asks about mock tests, you ask their current percentile before advising
8. You know the actual CAT syllabus cold: VARC (RC + VA), DILR (DI + LR), QA — and specific subtopics

RESPONSE STYLE:
- Keep responses conversational, 3-6 sentences for simple questions
- For plans/strategies, give structured but warm responses
- End responses with either a follow-up question OR a clear next action step
- Never dump everything at once — peel the onion layer by layer
- If you don't have enough info to give specific advice, ASK first before answering generically

IMPORTANT RULES:
- Never recommend paid resources unless the student mentions budget is okay
- Always acknowledge the emotional reality first before diving into strategy
- If a student seems demotivated, address that before giving study tips
- For students on their 2nd or 3rd attempt, acknowledge the weight of that specifically
- Always end with momentum — the student should feel clearer and more energized after talking to you`;

// Student profile built during onboarding
let studentProfile = {
  attemptNumber: null,
  monthsLeft: null,
  weakestSection: null,
  dailyHours: null,
  situation: null,
  targetColleges: null
};

let conversationHistory = [];
let onboardingStep = 0;
let onboardingComplete = false;
let isLoading = false;

const onboardingFlow = [
  {
    message: "Namaste! 🙏 I'm Marg — your personal CAT mentor.\n\nBefore I give you advice that actually fits your situation, I need to understand you first. Generic CAT tips are everywhere — I want to give you something specific to *you*.\n\nLet's start: is this your first attempt at CAT, or have you been here before?",
    key: 'attemptNumber',
    options: ['1st attempt', '2nd attempt', '3rd attempt or more'],
    followUp: {
      '2nd attempt': "Respect for coming back. Second attempt takes real courage — most people give up. I want to make sure this time is different for you.",
      '3rd attempt or more': "That persistence is rare. Seriously. Let's make sure we understand exactly what hasn't been working, so this attempt is genuinely different."
    }
  },
  {
    message: "How many months do you have until CAT this year?",
    key: 'monthsLeft',
    options: ['Less than 2 months', '2-4 months', '4-6 months', '6+ months'],
  },
  {
    message: "Which section gives you the most trouble right now?",
    key: 'weakestSection',
    options: ['VARC (Reading & Verbal)', 'DILR (Data & Logic)', 'QA (Quant)', 'All equally weak 😅'],
  },
  {
    message: "Realistically, how many hours can you study every day?",
    key: 'dailyHours',
    options: ['1-2 hours', '3-4 hours', '5-6 hours', '7+ hours'],
  },
  {
    message: "And your current situation — this helps me understand your constraints:",
    key: 'situation',
    options: ['Final year college student', 'Working professional', 'Dropped everything for CAT prep', 'Preparing alongside other exams'],
  }
];

function addMessage(role, html, showAvatar = true) {
  const container = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = `msg-wrap ${role} fade-in`;

  if (role === 'marg' && showAvatar) {
    wrap.innerHTML = `<div class="avatar">M</div><div class="bubble">${html}</div>`;
  } else if (role === 'user') {
    wrap.innerHTML = `<div class="bubble">${html}</div>`;
  } else {
    wrap.innerHTML = `<div class="bubble">${html}</div>`;
    wrap.style.marginLeft = '38px';
  }

  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
  return wrap;
}

function addOnboardingCard(step) {
  const container = document.getElementById('messages');
  const card = document.createElement('div');
  card.style.marginLeft = '38px';
  card.className = 'fade-in';
  card.id = `onboard-${step}`;

  const opts = onboardingFlow[step].options.map(o =>
    `<button class="opt-btn" onclick="selectOption('${o}', ${step})">${o}</button>`
  ).join('');

  card.innerHTML = `<div class="onboard-card"><div class="options-grid">${opts}</div></div>`;
  container.appendChild(card);
  container.scrollTop = container.scrollHeight;
}

function selectOption(value, step) {
  // Disable all buttons in this card
  const card = document.getElementById(`onboard-${step}`);
  if (card) {
    card.querySelectorAll('.opt-btn').forEach(b => {
      b.disabled = true;
      b.style.opacity = b.textContent === value ? '1' : '0.3';
      if (b.textContent === value) b.classList.add('selected');
    });
  }

  // Store in profile
  const key = onboardingFlow[step].key;
  studentProfile[key] = value;

  // Show user bubble
  addMessage('user', value);

  // Check for emotional follow-up
  const followUp = onboardingFlow[step].followUp;
  if (followUp && followUp[value]) {
    setTimeout(() => {
      addMessage('marg', followUp[value]);
      proceedOnboarding(step);
    }, 600);
  } else {
    proceedOnboarding(step);
  }
}

function proceedOnboarding(step) {
  const nextStep = step + 1;

  if (nextStep < onboardingFlow.length) {
    setTimeout(() => {
      onboardingStep = nextStep;
      addMessage('marg', onboardingFlow[nextStep].message);
      addOnboardingCard(nextStep);
    }, 800);
  } else {
    // Onboarding complete
    setTimeout(() => finishOnboarding(), 800);
  }
}

function finishOnboarding() {
  onboardingComplete = true;

  // Build profile summary
  const profileHtml = `
    <div class="profile-card">
      <div class="label">Your Marg Profile</div>
      <div class="profile-row">
        <div class="profile-item"><span>Attempt</span><span>${studentProfile.attemptNumber}</span></div>
        <div class="profile-item"><span>Time left</span><span>${studentProfile.monthsLeft}</span></div>
        <div class="profile-item"><span>Weak area</span><span>${studentProfile.weakestSection}</span></div>
        <div class="profile-item"><span>Daily hours</span><span>${studentProfile.dailyHours}</span></div>
        <div class="profile-item"><span>Situation</span><span>${studentProfile.situation}</span></div>
      </div>
    </div>`;

  const firstMsg = buildPersonalizedOpening();

  setTimeout(() => {
    addMessage('marg', firstMsg + profileHtml, true);
    document.getElementById('profile-badge').style.display = 'block';

    // Enable input
    document.getElementById('user-input').disabled = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('user-input').focus();

    // Add suggestion chips
    addSuggestionChips();

    // Seed conversation history with profile
    conversationHistory.push({
      role: 'user',
      content: `My profile: Attempt number: ${studentProfile.attemptNumber}, Months until CAT: ${studentProfile.monthsLeft}, Weakest section: ${studentProfile.weakestSection}, Daily study hours: ${studentProfile.dailyHours}, Current situation: ${studentProfile.situation}`
    });
    conversationHistory.push({
      role: 'assistant',
      content: firstMsg
    });
  }, 1000);
}

function buildPersonalizedOpening() {
  const attempt = studentProfile.attemptNumber;
  const months = studentProfile.monthsLeft;
  const weak = studentProfile.weakestSection;
  const hours = studentProfile.dailyHours;
  const situation = studentProfile.situation;

  let opening = '';

  if (attempt === '1st attempt') {
    opening = `Good — you're starting fresh, which means no bad habits to unlearn. That's actually an advantage most people don't realise.`;
  } else if (attempt === '2nd attempt') {
    opening = `I've got your profile. Second attempt — you know what the exam feels like now. That experience is more valuable than you think. This time we go in with a real plan, not just hard work.`;
  } else {
    opening = `Okay. I have your full picture. Multiple attempts mean you're serious about this — but it also means something specific hasn't been clicking. Let's find exactly what that is.`;
  }

  opening += ` With <span class="highlight">${months}</span> left, studying <span class="highlight">${hours}/day</span>, and <span class="highlight">${weak}</span> as your weak spot — here's where we stand:`;

  return opening;
}

function addSuggestionChips() {
  const container = document.getElementById('messages');
  const chipsDiv = document.createElement('div');
  chipsDiv.style.marginLeft = '38px';
  chipsDiv.className = 'fade-in';

  const suggestions = getSuggestions();
  const chipsHtml = suggestions.map(s =>
    `<button class="chip" onclick="sendQuick('${s}')">${s}</button>`
  ).join('');

  chipsDiv.innerHTML = `<div class="chips">${chipsHtml}</div>`;
  container.appendChild(chipsDiv);
  container.scrollTop = container.scrollHeight;
}

function getSuggestions() {
  const weak = studentProfile.weakestSection;
  const months = studentProfile.monthsLeft;

  const base = ['Make my study plan', 'Which mock tests should I take?', 'How do I improve my accuracy?'];

  if (weak && weak.includes('VARC')) return ['How to improve VARC fast', 'RC strategy for beginners', ...base.slice(1)];
  if (weak && weak.includes('DILR')) return ['DILR sets practice strategy', 'How to attempt DILR in exam', ...base.slice(1)];
  if (weak && weak.includes('QA')) return ['QA topics to prioritise', 'How to build QA basics fast', ...base.slice(1)];
  return base;
}

function showProfile() {
  const p = studentProfile;
  alert(`Your Marg Profile:\n\nAttempt: ${p.attemptNumber}\nTime left: ${p.monthsLeft}\nWeakest section: ${p.weakestSection}\nDaily hours: ${p.dailyHours}\nSituation: ${p.situation}`);
}

function showTyping() {
  const container = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap marg fade-in';
  wrap.id = 'typing-wrap';
  wrap.innerHTML = `<div class="avatar">M</div><div class="typing-bubble"><span></span><span></span><span></span></div>`;
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-wrap');
  if (el) el.remove();
}

function sendQuick(text) {
  if (isLoading || !onboardingComplete) return;
  document.getElementById('user-input').value = text;
  sendMessage();
}

async function sendMessage() {
  if (isLoading || !onboardingComplete) return;
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('send-btn').disabled = true;

  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  showTyping();

  // Build profile context for system
  const profileContext = `\n\nSTUDENT PROFILE:\n- Attempt number: ${studentProfile.attemptNumber}\n- Months until CAT: ${studentProfile.monthsLeft}\n- Weakest section: ${studentProfile.weakestSection}\n- Daily study hours: ${studentProfile.dailyHours}\n- Current situation: ${studentProfile.situation}`;

  try {
    const response = await fetch('marg.singhalgarv215.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: SYSTEM_PROMPT + profileContext,
        messages: conversationHistory
      })
    });

    const data = await response.json();
    const reply = data.content?.map(b => b.text || '').join('') || 'Something went wrong. Please try again.';

    hideTyping();
    conversationHistory.push({ role: 'assistant', content: reply });

    // Format reply
    const formatted = reply
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\n\n/g, '<br><br>')
      .replace(/\n/g, '<br>');

    addMessage('marg', formatted);

  } catch (e) {
    hideTyping();
    addMessage('marg', 'Yaar, connection issue. Please try again in a moment.');
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

// Auto-resize textarea
document.getElementById('user-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

document.getElementById('user-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Start onboarding
window.onload = () => {
  setTimeout(() => {
    addMessage('marg', onboardingFlow[0].message);
    addOnboardingCard(0);
  }, 400);
};
</script>
</body>
</html>
