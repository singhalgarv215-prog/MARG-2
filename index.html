<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marg — Your CAT Mentor</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0D0D0D;
    --surface: #161616;
    --surface2: #1E1E1E;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --gold-dim: rgba(201,168,76,0.12);
    --gold-dim2: rgba(201,168,76,0.06);
    --text: #F0EDE6;
    --text-muted: #888880;
    --text-dim: #555550;
    --green: #4CAF7D;
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #loading-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--text-muted);
  }
  #login-screen {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 24px;
  }
  .login-logo {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #C9A84C, #8B6914);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 28px; font-weight: 600;
    color: #0D0D0D;
  }
  .login-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px; font-weight: 500;
    color: var(--gold-light);
    text-align: center;
  }
  .login-sub {
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.6;
    max-width: 300px;
  }
  .google-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    color: #333;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
    width: 100%; max-width: 300px;
    justify-content: center;
  }
  .google-btn:hover { opacity: 0.9; }
  .google-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .login-note {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    max-width: 260px;
    line-height: 1.5;
  }
  #header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: none;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    flex-shrink: 0;
  }
  #logo {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #C9A84C, #8B6914);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 16px; font-weight: 600;
    color: #0D0D0D; flex-shrink: 0;
  }
  #header-info { flex: 1; }
  #header-info h1 {
    font-family: 'Playfair Display', serif;
    font-size: 15px; font-weight: 500;
    color: var(--gold-light);
    letter-spacing: 0.02em;
  }
  #header-info p { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  #status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
    margin-right: 5px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  #user-info { display: flex; align-items: center; gap: 8px; }
  #user-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; overflow: hidden;
  }
  #user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  #logout-btn {
    font-size: 11px; color: var(--text-dim);
    background: none; border: none;
    cursor: pointer; padding: 2px 6px;
    border-radius: 4px;
  }
  #logout-btn:hover { color: var(--text-muted); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: none;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .msg-wrap { display: flex; gap: 10px; align-items: flex-end; max-width: 82%; }
  .msg-wrap.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-wrap.marg { align-self: flex-start; }
  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #C9A84C, #8B6914);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 11px; font-weight: 600;
    color: #0D0D0D; flex-shrink: 0;
  }
  .bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.65;
    max-width: 100%;
  }
  .msg-wrap.marg .bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }
  .msg-wrap.user .bubble {
    background: var(--gold-dim);
    border: 1px solid rgba(201,168,76,0.2);
    border-bottom-right-radius: 4px;
    color: var(--text);
  }
  .onboard-card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 16px; margin-top: 4px;
  }
  .options-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; padding: 7px 14px;
    border: 1px solid var(--border2);
    border-radius: 20px;
    background: transparent; color: var(--text);
    cursor: pointer; transition: all 0.2s;
  }
  .opt-btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-dim2); }
  .opt-btn.selected { border-color: var(--gold); background: var(--gold-dim); color: var(--gold-light); }
  .profile-card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-left: 3px solid var(--gold);
    border-radius: var(--radius-sm);
    padding: 12px 14px; margin-top: 4px;
    font-size: 13px;
  }
  .profile-card .label {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--gold); margin-bottom: 6px;
  }
  .profile-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .profile-item { display: flex; flex-direction: column; gap: 2px; }
  .profile-item span:first-child { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .profile-item span:last-child { font-size: 13px; color: var(--text); font-weight: 500; }
  .typing-bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-bottom-left-radius: 4px;
    padding: 13px 16px;
    display: flex; gap: 5px; align-items: center;
  }
  .typing-bubble span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.3s infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes bounce {
    0%,60%,100%{transform:translateY(0);background:var(--text-dim)}
    30%{transform:translateY(-5px);background:var(--gold)}
  }
  #input-area {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    display: none;
  }
  #input-row { display: flex; gap: 10px; align-items: flex-end; }
  #user-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 22px;
    padding: 10px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; color: var(--text);
    resize: none; outline: none;
    max-height: 120px; overflow-y: auto;
    transition: border-color 0.2s;
    line-height: 1.5;
  }
  #user-input:focus { border-color: rgba(201,168,76,0.4); }
  #user-input::placeholder { color: var(--text-dim); }
  #send-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #C9A84C, #8B6914);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s, transform 0.15s;
  }
  #send-btn:hover { opacity: 0.85; transform: scale(1.05); }
  #send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  #send-btn svg { width: 16px; height: 16px; fill: #0D0D0D; }
  #hint { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 8px; }
  .highlight { color: var(--gold-light); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px; padding: 5px 11px;
    border: 1px solid var(--border2);
    border-radius: 14px;
    background: transparent; color: var(--text-muted);
    cursor: pointer; transition: all 0.18s;
  }
  .chip:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-dim2); }
  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
</style>
</head>
<body>

<div id="loading-screen">Loading Marg...</div>

<div id="login-screen">
  <div class="login-logo">M</div>
  <div>
    <div class="login-title">Marg</div>
    <div class="login-sub" style="margin-top:8px;">Your personal CAT mentor. Built for Indian aspirants figuring it out on their own.</div>
  </div>
  <button class="google-btn" onclick="loginWithGoogle()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Continue with Google
  </button>

</div>

<div id="header">
  <div id="logo">M</div>
  <div id="header-info">

  <div id="user-info">

</div>

<div id="messages"></div>

<div id="input-area">

    <textarea id="user-input" rows="1" placeholder="Ask Marg anything about CAT..." disabled></textarea>

      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>

  <div id="hint">Press Enter to send · Shift+Enter for new line</div>
</div>

<script>
const SUPABASE_URL = 'https://kduqtrumhveteyjkyltf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdXF0cnVtaHZldGV5amt5bHRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNjc0MzMsImV4cCI6MjA5NDc0MzQzM30.iUmZLf_GaeTyv2xD0VYY7sYEiTgavQVbITmc-KC6ZPo';
const WORKER_URL = 'https://marg.singhalgarv215.workers.dev/';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SYSTEM_PROMPT = `You are Marg, a warm and deeply knowledgeable CAT exam mentor built specifically for Indian students. Your name means "path" in Hindi — you are literally their path to success.

PERSONALITY:
- You speak like a brilliant senior who cracked CAT and genuinely wants to help juniors
- Warm, real, never preachy or robotic
- You understand Indian student reality: pressure from parents, financial constraints, coaching vs self-study dilemma, juggling college and prep simultaneously, the shame of failing CAT, the confusion of "where do I even start"
- Occasionally use natural Hindi phrases like "bilkul", "dekho", "suno", "yaar" — but sparingly and only when it feels natural
- Never generic. Every response is tailored to the student's specific profile you have built

STUDENT PROFILE (you will receive this as context):
You have already collected: attempt number, months until exam, weakest section, daily study hours, current situation. USE THIS PROFILE IN EVERY RESPONSE.

DIFFERENTIATION FROM GENERIC CHATBOTS:
1. You reference their specific profile in responses
2. You ask smart follow-up questions mid-conversation when you need more context
3. You understand Indian CAT coaching ecosystem: TIME, IMS, CL, Unacademy, PW, self-study routes
4. You know Indian college priorities: IIM A/B/C vs new IIMs vs XLRI vs MDI vs FMS
5. You understand the emotional weight of failed attempts, parental pressure, peer comparison
6. You give specific weekly/monthly plans, not vague advice
7. When someone asks about mock tests, you ask their current percentile before advising
8. You know CAT syllabus: VARC (RC + VA), DILR (DI + LR), QA and specific subtopics

RESPONSE STYLE:
- Keep responses conversational, 3-6 sentences for simple questions
- End responses with either a follow-up question OR a clear next action step
- Never dump everything at once
- If you do not have enough info, ASK first before answering generically

IMPORTANT RULES:
- Never recommend paid resources unless student mentions budget is okay
- Always acknowledge emotional reality first before diving into strategy
- If student seems demotivated, address that before giving study tips
- For students on 2nd or 3rd attempt, acknowledge the weight specifically
- Always end with momentum — student should feel clearer and more energized`;

let currentUser = null;
let studentProfile = { attemptNumber: null, monthsLeft: null, weakestSection: null, dailyHours: null, situation: null };
let conversationHistory = [];
let onboardingStep = 0;
let onboardingComplete = false;
let isLoading = false;

const onboardingFlow = [
  {
    message: "Namaste! 🙏 I'm Marg — your personal CAT mentor.\n\nBefore I give you advice that actually fits your situation, I need to understand you first. Generic CAT tips are everywhere — I want to give you something specific to you.\n\nLet's start: is this your first attempt at CAT, or have you been here before?",
    key: 'attemptNumber',
    options: ['1st attempt', '2nd attempt', '3rd attempt or more'],
    followUp: {
      '2nd attempt': "Respect for coming back. Second attempt takes real courage — most people give up. I want to make sure this time is different for you.",
      '3rd attempt or more': "That persistence is rare. Seriously. Let's make sure we understand exactly what hasn't been working, so this attempt is genuinely different."
    }
  },
  {
    message: "How many months do you have until CAT this year?",
    key: 'monthsLeft',
    options: ['Less than 2 months', '2-4 months', '4-6 months', '6+ months']
  },
  {
    message: "Which section gives you the most trouble right now?",
    key: 'weakestSection',
    options: ['VARC (Reading & Verbal)', 'DILR (Data & Logic)', 'QA (Quant)', 'All equally weak 😅']
  },
  {
    message: "Realistically, how many hours can you study every day?",
    key: 'dailyHours',
    options: ['1-2 hours', '3-4 hours', '5-6 hours', '7+ hours']
  },
  {
    message: "And your current situation — this helps me understand your constraints:",
    key: 'situation',
    options: ['Final year college student', 'Working professional', 'Dropped everything for CAT prep', 'Preparing alongside other exams']
  }
];

async function loginWithGoogle() {
  await db.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
}

async function logout() {
  await db.auth.signOut();
  location.reload();
}

async function saveChatMessage(role, content) {
  if (!currentUser) return;
  await db.from('chats').insert({ user_id: currentUser.id, role, content });
}

async function saveProfile() {
  if (!currentUser) return;
  await db.from('profiles').upsert({
    user_id: currentUser.id,
    attempt_number: studentProfile.attemptNumber,
    months_left: studentProfile.monthsLeft,
    weakest_section: studentProfile.weakestSection,
    daily_hours: studentProfile.dailyHours,
    situation: studentProfile.situation
  });
}

async function loadUserData() {
  if (!currentUser) return false;
  const { data: profile } = await db.from('profiles').select('*').eq('user_id', currentUser.id).single();
  if (profile) {
    studentProfile = {
      attemptNumber: profile.attempt_number,
      monthsLeft: profile.months_left,
      weakestSection: profile.weakest_section,
      dailyHours: profile.daily_hours,
      situation: profile.situation
    };
    const { data: chats } = await db.from('chats').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: true });
    if (chats && chats.length > 0) {
      conversationHistory = chats.map(c => ({ role: c.role, content: c.content }));
      return true;
    }
  }
  return false;
}

function showApp() {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('header').style.display = 'flex';
  document.getElementById('messages').style.display = 'flex';
  document.getElementById('input-area').style.display = 'block';
}

function showLogin() {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function updateUserUI(user) {
  const avatar = document.getElementById('user-avatar');
  if (user.user_metadata && user.user_metadata.avatar_url) {
    avatar.innerHTML = '<img src="' + user.user_metadata.avatar_url + '" alt="avatar">';
  } else {
    avatar.textContent = (user.email || 'U')[0].toUpperCase();
  }
}

function addMessage(role, html, showAvatar) {
  if (showAvatar === undefined) showAvatar = true;
  const container = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + role + ' fade-in';
  if (role === 'marg' && showAvatar) {
    wrap.innerHTML = '<div class="avatar">M</div><div class="bubble">' + html + '</div>';
  } else if (role === 'user') {
    wrap.innerHTML = '<div class="bubble">' + html + '</div>';
  } else {
    wrap.innerHTML = '<div class="bubble">' + html + '</div>';
    wrap.style.marginLeft = '38px';
  }
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
  return wrap;
}

function addOnboardingCard(step) {
  const container = document.getElementById('messages');
  const card = document.createElement('div');
  card.style.marginLeft = '38px';
  card.className = 'fade-in';
  card.id = 'onboard-' + step;
  const opts = onboardingFlow[step].options.map(function(o) {
    return '<button class="opt-btn" onclick="selectOption(\'' + o + '\', ' + step + ')">' + o + '</button>';
  }).join('');
  card.innerHTML = '<div class="onboard-card"><div class="options-grid">' + opts + '</div></div>';
  container.appendChild(card);
  container.scrollTop = container.scrollHeight;
}

function selectOption(value, step) {
  const card = document.getElementById('onboard-' + step);
  if (card) {
    card.querySelectorAll('.opt-btn').forEach(function(b) {
      b.disabled = true;
      b.style.opacity = b.textContent === value ? '1' : '0.3';
      if (b.textContent === value) b.classList.add('selected');
    });
  }
  studentProfile[onboardingFlow[step].key] = value;
  addMessage('user', value);
  const followUp = onboardingFlow[step].followUp;
  if (followUp && followUp[value]) {
    setTimeout(function() {
      addMessage('marg', followUp[value]);
      proceedOnboarding(step);
    }, 600);
  } else {
    proceedOnboarding(step);
  }
}

function proceedOnboarding(step) {
  const nextStep = step + 1;
  if (nextStep < onboardingFlow.length) {
    setTimeout(function() {
      onboardingStep = nextStep;
      addMessage('marg', onboardingFlow[nextStep].message);
      addOnboardingCard(nextStep);
    }, 800);
  } else {
    setTimeout(finishOnboarding, 800);
  }
}

async function finishOnboarding() {
  onboardingComplete = true;
  await saveProfile();

  const profileHtml = '<div class="profile-card"><div class="label">Your Marg Profile</div><div class="profile-row"><div class="profile-item"><span>Attempt</span><span>' + studentProfile.attemptNumber + '</span></div><div class="profile-item"><span>Time left</span><span>' + studentProfile.monthsLeft + '</span></div><div class="profile-item"><span>Weak area</span><span>' + studentProfile.weakestSection + '</span></div><div class="profile-item"><span>Daily hours</span><span>' + studentProfile.dailyHours + '</span></div><div class="profile-item"><span>Situation</span><span>' + studentProfile.situation + '</span></div></div></div>';

  const firstMsg = buildPersonalizedOpening();

  setTimeout(function() {
    addMessage('marg', firstMsg + profileHtml, true);
    document.getElementById('user-input').disabled = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('user-input').focus();
    addSuggestionChips();

    const profileMsg = 'My profile: Attempt number: ' + studentProfile.attemptNumber + ', Months until CAT: ' + studentProfile.monthsLeft + ', Weakest section: ' + studentProfile.weakestSection + ', Daily study hours: ' + studentProfile.dailyHours + ', Current situation: ' + studentProfile.situation;
    conversationHistory.push({ role: 'user', content: profileMsg });
    conversationHistory.push({ role: 'assistant', content: firstMsg });
    saveChatMessage('user', profileMsg);
    saveChatMessage('assistant', firstMsg);
  }, 1000);
}

function buildPersonalizedOpening() {
  const attempt = studentProfile.attemptNumber;
  const months = studentProfile.monthsLeft;
  const weak = studentProfile.weakestSection;
  const hours = studentProfile.dailyHours;
  let opening = '';
  if (attempt === '1st attempt') {
    opening = "Good — you're starting fresh, which means no bad habits to unlearn. That's actually an advantage most people don't realise.";
  } else if (attempt === '2nd attempt') {
    opening = "I've got your profile. Second attempt — you know what the exam feels like now. That experience is more valuable than you think. This time we go in with a real plan, not just hard work.";
  } else {
    opening = "Okay. I have your full picture. Multiple attempts mean you're serious about this — but it also means something specific hasn't been clicking. Let's find exactly what that is.";
  }
  opening += ' With <span class="highlight">' + months + '</span> left, studying <span class="highlight">' + hours + '/day</span>, and <span class="highlight">' + weak + '</span> as your weak spot — here\'s where we stand:';
  return opening;
}

function restoreConversation() {
  onboardingComplete = true;
  document.getElementById('user-input').disabled = false;
  document.getElementById('send-btn').disabled = false;

  conversationHistory.forEach(function(msg) {
    const formatted = msg.content
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\n\n/g, '<br><br>')
      .replace(/\n/g, '<br>');
    addMessage(msg.role === 'user' ? 'user' : 'marg', formatted);
  });

  addMessage('marg', 'Welcome back! 👋 Ready to continue from where we left off?', true);
  document.getElementById('user-input').focus();
}

function addSuggestionChips() {
  const container = document.getElementById('messages');
  const chipsDiv = document.createElement('div');
  chipsDiv.style.marginLeft = '38px';
  chipsDiv.className = 'fade-in';
  const weak = studentProfile.weakestSection;
  let suggestions = ['Make my study plan', 'Which mock tests should I take?', 'How do I improve my accuracy?'];
  if (weak && weak.includes('VARC')) suggestions = ['How to improve VARC fast', 'RC strategy for beginners', 'Which mock tests should I take?'];
  if (weak && weak.includes('DILR')) suggestions = ['DILR sets practice strategy', 'How to attempt DILR in exam', 'Which mock tests should I take?'];
  if (weak && weak.includes('QA')) suggestions = ['QA topics to prioritise', 'How to build QA basics fast', 'Which mock tests should I take?'];
  chipsDiv.innerHTML = '<div class="chips">' + suggestions.map(function(s) { return '<button class="chip" onclick="sendQuick(\'' + s + '\')">' + s + '</button>'; }).join('') + '</div>';
  container.appendChild(chipsDiv);
  container.scrollTop = container.scrollHeight;
}

function showTyping() {
  const container = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap marg fade-in';
  wrap.id = 'typing-wrap';
  wrap.innerHTML = '<div class="avatar">M</div><div class="typing-bubble"><span></span><span></span><span></span></div>';
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-wrap');
  if (el) el.remove();
}

function sendQuick(text) {
  if (isLoading || !onboardingComplete) return;
  document.getElementById('user-input').value = text;
  sendMessage();
}

async function sendMessage() {
  if (isLoading || !onboardingComplete) return;
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('send-btn').disabled = true;

  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });
  saveChatMessage('user', text);
  showTyping();

  const profileContext = '\n\nSTUDENT PROFILE:\n- Attempt number: ' + studentProfile.attemptNumber + '\n- Months until CAT: ' + studentProfile.monthsLeft + '\n- Weakest section: ' + studentProfile.weakestSection + '\n- Daily study hours: ' + studentProfile.dailyHours + '\n- Current situation: ' + studentProfile.situation;

  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: SYSTEM_PROMPT + profileContext,
        messages: conversationHistory
      })
    });

    const data = await response.json();
    const reply = (data.content && data.content.map(function(b) { return b.text || ''; }).join('')) || 'Something went wrong. Please try again.';

    hideTyping();
    conversationHistory.push({ role: 'assistant', content: reply });
    saveChatMessage('assistant', reply);

    const formatted = reply
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\n\n/g, '<br><br>')
      .replace(/\n/g, '<br>');

    addMessage('marg', formatted);
  } catch (e) {
    hideTyping();
    addMessage('marg', 'Yaar, connection issue. Please try again in a moment.');
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

document.getElementById('user-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

document.getElementById('user-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

window.onload = async function() {
  const { data: { session } } = await db.auth.getSession();

  if (session) {
    currentUser = session.user;
    updateUserUI(currentUser);
    showApp();
    const hasHistory = await loadUserData();
    if (hasHistory) {
      restoreConversation();
    } else {
      addMessage('marg', onboardingFlow[0].message);
      addOnboardingCard(0);
    }
  } else {
    showLogin();
  }

  db.auth.onAuthStateChange(async function(event, session) {
    if (event === 'SIGNED_IN' && session) {
      currentUser = session.user;
      updateUserUI(currentUser);
      showApp();
      const hasHistory = await loadUserData();
      if (hasHistory) {
        restoreConversation();
      } else {
        addMessage('marg', onboardingFlow[0].message);
        addOnboardingCard(0);
      }
    }
  });
};
</script>
